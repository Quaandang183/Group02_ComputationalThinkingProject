<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TripWise · Đăng ký tài khoản</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="assets/images/logo-circle.png">
</head>
<body class="phone-screen-body">
  <div class="app-container auth-form-container register-scroll-container">
    
    <!-- Background văn hóa & Lớp phủ kem đồng bộ Figma (Node 1376:2737) -->
    <div class="auth-bg-layer">
      <img src="assets/images/cultural_pattern.png" alt="Cultural Background" class="auth-bg-img">
      <div class="auth-cream-overlay" style="opacity: 0.90;"></div>
      <div class="auth-gradient-overlay"></div>
    </div>

    <!-- Header bar: Nút Back + Tiêu đề "Đăng ký" căn giữa (Node 1376:2740) -->
    <header class="auth-nav-header with-title">
      <a href="login.html" class="btn-auth-back" title="Quay lại đăng nhập" aria-label="Quay lại đăng nhập">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1e3f20" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"></path>
          <path d="M12 19l-7-7 7-7"></path>
        </svg>
      </a>
      <h1 class="auth-header-title">Đăng ký</h1>
      <div class="auth-header-spacer"></div>
    </header>

    <!-- Registration Content Form: Căn giữa trang (Node 1376:2746) -->
    <main class="auth-main-content register-form-content">
      
      <form action="login.html" method="GET" class="auth-form register-form-centered" id="registerForm" onsubmit="alert('Đăng ký tài khoản TripWise thành công! Vui lòng đăng nhập.');">
        
        <!-- Trường 1: Họ và tên (Node 1376:2749) -->
        <div class="auth-field-group">
          <label class="auth-field-label" for="reg-fullname">Họ và tên</label>
          <div class="auth-input-box">
            <input type="text" id="reg-fullname" class="auth-input" placeholder="Nhập họ và tên" required>
          </div>
        </div>

        <!-- Trường 2: Địa chỉ Email (Node 1376:2754) -->
        <div class="auth-field-group">
          <label class="auth-field-label" for="reg-email">Địa chỉ Email</label>
          <div class="auth-input-box">
            <input type="email" id="reg-email" class="auth-input" placeholder="Nhập email của bạn" required>
          </div>
        </div>

        <!-- Trường 3: Mật khẩu (Node 1376:2759) -->
        <div class="auth-field-group">
          <label class="auth-field-label" for="reg-pwd">Mật khẩu</label>
          <div class="auth-input-box">
            <input type="password" id="reg-pwd" class="auth-input" placeholder="Tạo mật khẩu" required>
            <button type="button" class="btn-pwd-eye" id="btnToggleRegPwd" aria-label="Hiện hoặc ẩn mật khẩu">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#758071" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Trường 4: Nhập lại mật khẩu (Node 1376:2766) -->
        <div class="auth-field-group">
          <label class="auth-field-label" for="reg-confirm-pwd">Nhập lại mật khẩu</label>
          <div class="auth-input-box">
            <input type="password" id="reg-confirm-pwd" class="auth-input" placeholder="Nhập lại mật khẩu của bạn" required>
            <button type="button" class="btn-pwd-eye" id="btnToggleConfirmPwd" aria-label="Hiện hoặc ẩn mật khẩu">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#758071" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Trường 5: Mô tả (Node 1376:2773) -->
        <div class="auth-field-group">
          <label class="auth-field-label" for="reg-bio">Mô tả</label>
          <div class="auth-input-box">
            <input type="text" id="reg-bio" class="auth-input" placeholder="Nhập mô tả ngắn về bạn">
          </div>
        </div>

        <!-- Điều khoản sử dụng (Node 1376:2778) -->
        <label class="auth-terms-checkbox-row">
          <input type="checkbox" id="reg-terms" required checked>
          <span>Tôi đồng ý với <strong>Điều khoản sử dụng</strong> và <strong>Chính sách bảo mật</strong>.</span>
        </label>

        <!-- Nút Đăng ký tài khoản (Node 1376:2782) -->
        <button type="submit" class="btn-auth-submit" aria-label="Xác nhận đăng ký tài khoản">
          <span>Đăng ký tài khoản</span>
        </button>

        <!-- Divider "Hoặc" (Node 1376:2786) -->
        <div class="auth-or-divider">
          <div class="divider-line"></div>
          <span class="divider-text">Hoặc</span>
          <div class="divider-line"></div>
        </div>

        <!-- Social Providers Grid: Google & Apple (Node 1376:2790) -->
        <div class="auth-social-row">
          <a href="index.html" class="btn-social-half google" aria-label="Đăng ký nhanh với Google">
            <img src="assets/images/icon-google.svg" alt="Google" width="20" height="20">
            <span>Google</span>
          </a>
          <a href="index.html" class="btn-social-half apple" aria-label="Đăng ký nhanh với Apple">
            <img src="assets/images/icon-apple.svg" alt="Apple" width="20" height="20" style="filter: brightness(0) invert(1);">
            <span>Apple</span>
          </a>
        </div>

      </form>

    </main>

    <!-- Footer link chuyển về Đăng nhập (Node 1376:2804) -->
    <footer class="auth-footer-prompt">
      <span>Đã có tài khoản?</span>
      <a href="login.html" class="link-bold-green">Đăng nhập</a>
    </footer>

  </div>

  <script>
    // Eye toggles for Register fields
    const toggleReg = document.getElementById('btnToggleRegPwd');
    const inputReg = document.getElementById('reg-pwd');
    if (toggleReg && inputReg) {
      toggleReg.addEventListener('click', () => {
        inputReg.type = inputReg.type === 'password' ? 'text' : 'password';
      });
    }

    const toggleConfirm = document.getElementById('btnToggleConfirmPwd');
    const inputConfirm = document.getElementById('reg-confirm-pwd');
    if (toggleConfirm && inputConfirm) {
      toggleConfirm.addEventListener('click', () => {
        inputConfirm.type = inputConfirm.type === 'password' ? 'text' : 'password';
      });
    }
  </script>
</body>
</html>
