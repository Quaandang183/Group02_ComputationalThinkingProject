            waypoints: 'Hồ Tuyền Lâm',
            stops: [
              { num: 1, name: '1. Đỉnh Pinhatt', meta: '07:30 • Trekking săn mây', isMuted: true },
              { num: 2, name: '2. Chèo kayak Hồ Tuyền Lâm', meta: '11:00 • Trải nghiệm mặt hồ' },
              { num: 3, name: '3. Kem bơ Nari', meta: '15:00 • Ăn vặt tráng miệng' },
              { num: 4, name: '4. Tiệc BBQ Rừng Thông (Tiếp theo)', meta: '18:00 • Lửa trại chia tay', isActive: true }
            ]
          }
        }
      },
      'trip-5': {
        id: 'trip-5',
        name: 'Mùa dã quỳ',
        shortName: 'Mùa dã quỳ',
        dates: '02/11/2024 – 04/11/2024',
        fullDates: '02/11/2024 – 04/11/2024',
        fullName: 'Mùa dã quỳ',
        days: {
          1: {
            title: 'Lộ trình Ngày 1',
            origin: 'Đèo Prenn Đà Lạt',
            destination: 'Khu du lịch Thác Datanla',
            waypoints: 'Cung đường Dã Quỳ Tu Tra',
            stops: [
              { num: 1, name: '1. Đèo Prenn', meta: '08:00 • Khởi đầu cung đường hoa', isMuted: true },
              { num: 2, name: '2. Cung dã quỳ Tu Tra', meta: '10:30 • Vàng rực triền đồi' },
              { num: 3, name: '3. Cơm lam gà nướng', meta: '12:30 • Ẩm thực Tây Nguyên' },
              { num: 4, name: '4. Thác Datanla (Tiếp theo)', meta: '15:00 • Trượt máng xuyên rừng', isActive: true }
            ]
          },
          2: {
            title: 'Lộ trình Ngày 2',
            origin: 'Đường hầm Hỏa Xa Đà Lạt',
            destination: 'Bình Lập Cà Phê',
            waypoints: 'Đồi hoa dã quỳ Cầu Đất',
            stops: [
              { num: 1, name: '1. Đồi hoa Cầu Đất', meta: '08:00 • Vườn hoa rực rỡ', isMuted: true },
              { num: 2, name: '2. Đường hầm Hỏa Xa', meta: '11:00 • Check-in hoài niệm' },
              { num: 3, name: '3. Bánh ướt lòng gà Long', meta: '13:00 • Ăn trưa ngon miệng' },
              { num: 4, name: '4. Bình Lập Cà Phê (Tiếp theo)', meta: '16:00 • Ngắm thung lũng đèn', isActive: true }
            ]
          },
          3: {
            title: 'Lộ trình Ngày 3',
            origin: 'Hồ Than Thở Đà Lạt',
            destination: 'Chợ Đà Lạt',
            waypoints: 'Làng hoa Vạn Thành',
            stops: [
              { num: 1, name: '1. Hồ Than Thở', meta: '08:30 • Không gian tĩnh lặng', isMuted: true },
              { num: 2, name: '2. Làng hoa Vạn Thành', meta: '11:00 • Vương quốc các loài hoa' },
              { num: 3, name: '3. Bánh tráng nướng Dì Đinh', meta: '15:00 • Pizza Đà Lạt nóng hổi' },
              { num: 4, name: '4. Chợ Đà Lạt (Tiếp theo)', meta: '17:30 • Mua mứt và dâu tây', isActive: true }
            ]
          }
        }
      }
    };

    // Alias tương thích ngược
    TRIPS_CATALOG['dalat'] = TRIPS_CATALOG['trip-1'];
    TRIPS_CATALOG['dalat-camp'] = TRIPS_CATALOG['trip-2'];
    TRIPS_CATALOG['dalat-daquy'] = TRIPS_CATALOG['trip-5'];

    // State hiện tại
    let currentTripId = 'trip-1';
    let currentDayNum = 1;
    let toastTimeout = null;

    // Toast notification
    function showToast(message) {
      const toast = document.getElementById('mapToast');
      if (!toast) return;
      toast.textContent = message;
      toast.classList.add('show');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    // Toggle Dropdown Chuyến đi
    const btnTripSelector = document.getElementById('btnTripSelector');
    const tripDropdownMenu = document.getElementById('tripDropdownMenu');

    if (btnTripSelector && tripDropdownMenu) {
      btnTripSelector.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = tripDropdownMenu.classList.toggle('open');
        btnTripSelector.classList.toggle('open', isOpen);
        btnTripSelector.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      });

      document.addEventListener('click', (e) => {
        if (!tripDropdownMenu.contains(e.target) && !btnTripSelector.contains(e.target)) {
          tripDropdownMenu.classList.remove('open');
          btnTripSelector.classList.remove('open');
          btnTripSelector.setAttribute('aria-expanded', 'false');
        }
      });
    }

    // Chọn Chuyến đi
    function selectTrip(tripId) {
      const trip = TRIPS_CATALOG[tripId];
      if (!trip) return;

      currentTripId = tripId;
      currentDayNum = 1;

      // Cập nhật text ô chọn chuyến đi (Khớp 100% Tên và Ngày đi - Ngày về)
      document.getElementById('currentTripName').textContent = trip.name;
      document.getElementById('currentTripDates').textContent = trip.fullDates || trip.dates;

      // Cập nhật trạng thái active trong dropdown
      document.querySelectorAll('.trip-option-item').forEach(item => {
        const itemTrip = item.getAttribute('data-trip');
        const isMatch = itemTrip === tripId || 
                        (tripId === 'trip-1' && itemTrip === 'dalat') ||
                        (tripId === 'dalat' && itemTrip === 'trip-1');
        item.classList.toggle('active', isMatch);
        item.setAttribute('aria-selected', isMatch ? 'true' : 'false');
      });

      // Đóng dropdown
      tripDropdownMenu.classList.remove('open');
      btnTripSelector.classList.remove('open');
      btnTripSelector.setAttribute('aria-expanded', 'false');

      // Render lại giao diện lộ trình
      renderCurrentRoute();
      showToast(`🗺️ Chuyến đi: ${trip.fullName || trip.name}`);
    }

    // Chuyển đổi Ngày (< và >)
    function changeRouteDay(delta) {
      const trip = TRIPS_CATALOG[currentTripId];
      if (!trip) return;

      const newDay = currentDayNum + delta;
      if (newDay < 1 || newDay > 3) return;

      currentDayNum = newDay;
      renderCurrentRoute();
      showToast(`📍 Đã chuyển sang Lộ trình Ngày ${currentDayNum}`);
    }

    // Render danh sách điểm dừng và cập nhật link Google Maps
    function renderCurrentRoute() {
      const trip = TRIPS_CATALOG[currentTripId];
      if (!trip) return;

      const dayData = trip.days[currentDayNum] || trip.days[1];

      // Cập nhật tiêu đề ngày
      document.getElementById('lblDayRoute').textContent = `Lộ trình Ngày ${currentDayNum}`;

      // Cập nhật trạng thái nút mũi tên
      const btnPrev = document.getElementById('btnPrevDay');
      const btnNext = document.getElementById('btnNextDay');
      if (btnPrev) btnPrev.disabled = (currentDayNum <= 1);
      if (btnNext) btnNext.disabled = (currentDayNum >= 3);

      // Render danh sách stops
      const track = document.getElementById('mapStopsTrack');
      if (track) {
        let stopsHtml = `<div class="map-stops-line" aria-hidden="true"></div>`;
        dayData.stops.forEach(stop => {
          const isMuted = stop.isMuted;
          const isActive = stop.isActive;
          stopsHtml += `
            <div class="map-stop-row ${isActive ? 'active' : ''}" id="stopRow${stop.num}" onclick="selectRouteStop(${stop.num})" role="button" tabindex="0">
              <div class="map-stop-node ${isMuted ? 'node-muted' : (isActive ? 'node-active' : '')}" id="stopNode${stop.num}"></div>
              <div class="map-stop-card ${isMuted ? 'card-muted' : (isActive ? 'card-active' : '')}" id="stopCard${stop.num}">${stop.name}</div>
            </div>
          `;
        });
        track.innerHTML = stopsHtml;
      }

      // Cập nhật link Google Maps
      const gmapsBtn = document.getElementById('mapGmapsBtn');
      if (gmapsBtn) {
        const origin = encodeURIComponent(dayData.origin);
        const dest = encodeURIComponent(dayData.destination);
        const waypoints = encodeURIComponent(dayData.waypoints);
        gmapsBtn.href = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${dest}&waypoints=${waypoints}`;
      }
    }

    // Chọn điểm dừng chi tiết
    function selectRouteStop(stopNum) {
      const trip = TRIPS_CATALOG[currentTripId];
      if (!trip) return;
      const dayData = trip.days[currentDayNum] || trip.days[1];

      // Xóa active cũ và set active mới
      dayData.stops.forEach(stop => {
        const row = document.getElementById('stopRow' + stop.num);
        const node = document.getElementById('stopNode' + stop.num);
        const card = document.getElementById('stopCard' + stop.num);
        const isTarget = (stop.num === stopNum);

        if (row) row.classList.toggle('active', isTarget);
        if (node) {
          node.className = 'map-stop-node' + (isTarget ? ' node-active' : (stop.isMuted ? ' node-muted' : ''));
        }
        if (card) {
          card.className = 'map-stop-card' + (isTarget ? ' card-active' : (stop.isMuted ? ' card-muted' : ''));
        }
      });

      const selected = dayData.stops.find(s => s.num === stopNum);
      if (selected) {
        showToast(`📍 Điểm dừng: ${selected.name}`);
      }
    }

    // Các nút chức năng nổi trên bản đồ
    let compassDeg = 0;
    function onCompassClick() {
      compassDeg += 360;
      const icon = document.getElementById('compassIcon');
      if (icon) {
        icon.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
        icon.style.transform = `rotate(${compassDeg}deg)`;
      }
      showToast('🧭 Đã định vị chính xác phương Bắc 0°');
    }

    let isSatellite = false;
    function onLayersClick() {
      isSatellite = !isSatellite;
      showToast(isSatellite ? '🗺️ Chế độ: Bản đồ vệ tinh chi tiết' : '🗺️ Chế độ: Bản đồ địa hình tiêu chuẩn');
    }

    function onLocateClick() {
      const btn = document.getElementById('btnLocate');
      if (btn) {
        btn.style.transform = 'scale(1.2)';
        setTimeout(() => { btn.style.transform = ''; }, 300);
      }
      const trip = TRIPS_CATALOG[currentTripId];
      showToast(`🎯 GPS: Vị trí hiện tại tại ${trip ? trip.name : 'Đà Lạt'}`);
    }

    // Khởi tạo hiển thị lần đầu
    renderCurrentRoute();
  </script>
</body>

</html>
